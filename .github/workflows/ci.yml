# Checks every pull request (and every push to master) on both supported
# platforms. Mirrors the "Commands" section of CLAUDE.md.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  # Lets the native-changes step list a PR's files.
  pull-requests: read

# A new push to the same PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  flutter:
    name: Flutter + native engine (${{ matrix.os }})
    # While the repo is private, macOS/Windows minutes are billed at a
    # multiplier, so this job only runs when started by hand (Actions → CI →
    # Run workflow). Once the repo is public it runs on every PR and push.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The native tests and the full app build only matter when a PR touches
      # the engine, the build hook, the runner projects or dependencies. The
      # job still runs (and reports) either way, so required checks never sit
      # pending the way a workflow-level `paths:` filter would leave them.
      # Pushes to master and manual runs always do everything.
      - name: Detect native changes
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          native=true
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
            pattern='^(native/|hook/|macos/|windows/|lib/core/native/|\.github/workflows/|\.gitmodules$|pubspec\.(yaml|lock)$)'
            grep -qE "$pattern" <<<"$files" || native=false
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Native steps: $native"

      # libASPL's CMake reads its version with `git describe --tags`, which
      # fails on checkout's shallow, tagless submodule clone. It's small, so
      # fetch its full history and tags (DeepFilterNet's stays shallow).
      - name: Fetch libASPL tags
        if: runner.os == 'macOS' && steps.changes.outputs.native == 'true'
        run: git -C native/macos_hal/third_party/libASPL fetch --unshallow --tags

      - uses: dtolnay/rust-toolchain@stable

      # DeepFilterNet (libDF + tract) is the slowest part of the build. The
      # Dart build hook compiles it, and the CMake test project reuses the
      # hook's --target-dir (see "Configure native tests"). Cache the cargo
      # registry and that target dir (rust-cache keeps dependencies, drops
      # our own crate).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/engine/dfshim -> ../../../.dart_tool/hooks_runner/shared/mute_around/build/cargo
          cache-on-failure: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      # Before build_runner, so generated (uncommitted) files aren't checked.
      - name: Check formatting
        if: runner.os == 'macOS'
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate code
        run: dart run build_runner build -d

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Dart tests
        run: flutter test

      # Unit, WAV-fixture and zero-allocation tests for the C engine. They
      # link the DeepFilterNet shim that `flutter test` built through the hook
      # (same cargo invocation, same target dir), so cargo doesn't compile it
      # again.
      - name: Configure native tests
        if: steps.changes.outputs.native == 'true'
        run: >
          cmake -S native/engine -B build/native-tests -DCMAKE_BUILD_TYPE=Release
          -DMUTE_DF_CARGO_TARGET_DIR:PATH=.dart_tool/hooks_runner/shared/mute_around/build/cargo

      - name: Build native tests
        if: steps.changes.outputs.native == 'true'
        run: cmake --build build/native-tests --config Release

      - name: Run native tests
        if: steps.changes.outputs.native == 'true'
        run: ctest --test-dir build/native-tests --build-config Release --output-on-failure

      # Catches breakage in the build hook, the HAL plug-in (macOS) and the
      # runner projects that the tests above don't compile.
      - name: Build app (macOS)
        if: runner.os == 'macOS' && steps.changes.outputs.native == 'true'
        run: flutter build macos --debug

      - name: Build app (Windows)
        if: runner.os == 'Windows' && steps.changes.outputs.native == 'true'
        run: flutter build windows --debug

  licenses:
    name: Rust dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # deny.toml targets both aarch64-apple-darwin and x86_64-pc-windows-msvc,
      # so the Windows-only crates are checked from this runner too.
      - name: cargo deny check licenses
        run: >
          cargo deny --manifest-path native/engine/dfshim/Cargo.toml
          --config native/engine/third_party/deny.toml check licenses

      # The licenses page lists every linked crate from this generated file;
      # fail when Cargo.lock changed without regenerating it.
      - uses: dart-lang/setup-dart@v1

      - name: Rust crate license texts are up to date
        run: dart tool/rust_licenses.dart --check
