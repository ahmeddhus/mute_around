# Static analysis for Mute Around.
#
# Base: the Flutter team's recommended set (package:flutter_lints), plus the
# Dart team's strict language modes and a curated set of extra rules that
# catch real bugs (async misuse, dynamic calls, leaked streams) without
# fighting the formatter.
#
# Run: `flutter analyze --fatal-infos` (CI and pre-commit must be clean).
# Lint reference: https://dart.dev/lints

include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 80
  # Keep trailing commas you write so widget trees stay one-arg-per-line.
  trailing_commas: preserve

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Promote bug-prone diagnostics to errors.
    missing_required_param: error
    missing_return: error
    unawaited_futures: error
    avoid_dynamic_calls: error
    close_sinks: error
    cancel_subscriptions: error
    # TODOs are allowed while developing.
    todo: ignore
    # Needed for freezed/json_serializable field annotations.
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - windows/**
    - macos/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/*.config.dart'
    - '**/*.module.dart'
    - '**/*.ffigen.dart'

linter:
  rules:
    # --- Errors / correctness ---
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements

    # --- Style ---
    - always_declare_return_types
    - always_use_package_imports
    - avoid_redundant_argument_values
    - avoid_unused_constructor_parameters
    - avoid_void_async
    - directives_ordering
    - leading_newlines_in_multiline_strings
    - missing_whitespace_between_adjacent_strings
    - noop_primitive_operations
    - only_throw_errors
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_if_elements_to_conditional_expressions
    - prefer_null_aware_method_calls
    - prefer_single_quotes
    - prefer_void_to_null
    - unnecessary_breaks
    - unnecessary_lambdas
    - unnecessary_null_checks
    - unnecessary_parenthesis
    - unreachable_from_main
    - use_enums
    - use_named_constants
    - use_string_buffers
    - use_super_parameters

    # --- Flutter widgets ---
    - sized_box_shrink_expand
    - use_colored_box
    - use_decorated_box
