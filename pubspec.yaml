name: mute_around
description: "Cancel background noise and improve your voice in real time on macOS and Windows."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^18.1.4
  get_it: ^9.3.0
  injectable: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  tray_manager: ^0.9.0
  window_manager: ^0.7.0
  url_launcher: ^6.3.3
  objective_c: ^9.6.4
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.6
  code_assets: ^2.2.0
  ffi: ^2.2.0
  nativeapi: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  build_runner: ^2.16.1
  go_router_builder: ^4.5.3
  injectable_generator: ^3.1.3
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  ffigen: ^23.0.0
  test: ^1.32.0
  logging: ^1.3.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
    # Native libraries' and the model's license texts, shown on the
    # licenses page (lib/app/licenses.dart).
    - native/engine/third_party/miniaudio/LICENSE
    - native/engine/third_party/deepfilternet/LICENSE-MIT
    - native/engine/third_party/deepfilternet/LICENSE-APACHE
    - native/engine/models/LICENSE-MIT
    - native/macos_hal/third_party/libASPL/LICENSE
